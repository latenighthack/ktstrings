name: Prepare signed Central release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in VERSION_NAME and matching v-prefixed tag
        required: true
        default: '0.1.0'
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: v${{ inputs.version }}
  signed-candidate:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.RELEASE_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare all signed publications without remote upload
        run: ./gradlew -PreleaseSigning=true publishAllPublicationsToCandidateRepository --max-workers=2
      - name: Verify tag and signed release metadata
        env:
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          printenv RELEASE_PUBLIC_KEY > build/release-public-key.asc
          python3 scripts/verify-release-metadata.py --version "$RELEASE_VERSION" --check-tag --require-signatures --public-key build/release-public-key.asc
      - uses: actions/upload-artifact@v4
        with:
          name: signed-central-candidate
          path: build/candidate-repository
